[project]
name = "prompt-handbook"
version = "0.1.0"
description = "Prompt 模式手册 + ReAct 版聊天机器人 — Phase 2 产出物"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "pydantic>=2.0.0",
    "tiktoken>=0.7.0",
    "dspy>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
